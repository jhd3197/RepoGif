<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RepoGif - Modern Spotlight</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
        }

        body {
            width: var(--gif-width, 1200px);
            height: var(--gif-height, 675px);
            display: flex;
            justify-content: center;
            align-items: center;
            background: #07090f;
            color: #f7f8fb;
            position: relative;
            overflow: hidden;
        }

        .aurora {
            position: absolute;
            border-radius: 50%;
            filter: blur(48px);
            pointer-events: none;
        }

        .aurora-violet {
            width: 48%;
            height: 78%;
            top: -22%;
            right: -8%;
            background: rgba(109, 94, 252, 0.55);
        }

        .aurora-mint {
            width: 42%;
            height: 70%;
            bottom: -28%;
            left: -8%;
            background: rgba(31, 214, 162, 0.34);
        }

        .aurora-gold {
            width: 28%;
            height: 46%;
            top: 8%;
            left: 24%;
            background: color-mix(in srgb, var(--accent, #f5c451) 42%, transparent);
        }

        .spotlight {
            position: relative;
            z-index: 1;
            width: calc(100% - 56px);
            height: calc(100% - 56px);
            display: flex;
            gap: 28px;
            padding: 36px 40px;
            border-radius: 32px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.10), rgba(255, 255, 255, 0.035));
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.18);
        }

        .spotlight.is-square {
            flex-direction: column;
            gap: 22px;
            padding: 44px 48px 40px;
            border-radius: 36px;
        }

        .main {
            flex: 1.2;
            min-width: 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 28px;
        }

        .identity {
            min-width: 0;
            flex: 1;
            overflow: hidden;
        }

        .kicker {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: #a7b0c0;
            margin-bottom: 12px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #3dd68c;
            box-shadow: 0 0 0 4px rgba(61, 214, 140, 0.16);
        }

        .owner {
            letter-spacing: 0.08em;
            color: #d5dbe6;
        }

        .owner::before {
            content: "·";
            margin-right: 8px;
            color: #667085;
        }

        .repo-name {
            display: block;
            width: 100%;
            font-size: clamp(46px, 5.5vw, 72px);
            font-weight: 700;
            letter-spacing: -0.04em;
            line-height: 0.98;
            color: #f7f8fb;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .spotlight.is-square .repo-name {
            font-size: clamp(60px, 7vw, 88px);
        }

        .star-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            margin-top: 28px;
            padding: 12px 18px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.16);
            color: #f7f8fb;
            font-size: 16px;
            font-weight: 600;
        }

        .spotlight.is-square .star-pill {
            margin-top: 36px;
            padding: 14px 20px;
            font-size: 18px;
        }

        .pill-icon,
        .stat-icon {
            transform-origin: center;
            flex-shrink: 0;
        }

        .pill-icon {
            width: 16px;
            height: 16px;
            fill: #c5ccd8;
        }

        .description {
            margin-top: 16px;
            max-width: 680px;
            font-size: clamp(16px, 1.55vw, 22px);
            line-height: 1.4;
            color: #c5ceda;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .spotlight.is-square .description {
            max-width: none;
            margin-top: 18px;
            font-size: 22px;
        }

        .badges {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 18px;
        }

        .topics {
            display: contents;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            height: 32px;
            padding: 0 12px;
            border-radius: 999px;
            background: rgba(8, 10, 16, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #e8edf5;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .lang-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent, #f5c451);
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-top: auto;
            padding-top: 22px;
        }

        .stats.no-forks {
            grid-template-columns: 1fr;
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
            padding: 16px 18px;
            border-radius: 18px;
            background: rgba(7, 9, 15, 0.48);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .stat-icon {
            width: 28px;
            height: 28px;
        }

        .star-icon {
            fill: #8b93a7;
        }

        .fork-icon {
            fill: #c5ccd8;
        }

        .stat-copy {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .star-count-slot,
        .fork-count {
            font-size: clamp(26px, 2.5vw, 34px);
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1.05;
            color: #f7f8fb;
            font-variant-numeric: tabular-nums;
        }

        .star-count-slot {
            position: relative;
            display: inline-block;
        }

        .star-count-sizer {
            visibility: hidden;
        }

        .star-count {
            position: absolute;
            left: 0;
            top: 0;
            font-variant-numeric: tabular-nums;
        }

        .stat-label {
            margin-top: 3px;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #a7b0c0;
        }

        .hero {
            flex: 0.92;
            min-width: 0;
            min-height: 0;
            border-radius: 22px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.28);
            background: rgba(0, 0, 0, 0.25);
        }

        .spotlight.is-square .hero {
            flex: 1;
            width: 100%;
        }

        .hero-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: var(--hero-focus, center);
            display: block;
        }

        [hidden] {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="aurora aurora-violet"></div>
    <div class="aurora aurora-mint"></div>
    <div class="aurora aurora-gold"></div>

    <div class="spotlight" id="spotlight">
        <div class="main">
            <div class="header">
                <div class="identity">
                    <div class="kicker">
                        <span class="dot"></span>
                        <span>Public</span>
                        <span class="owner" id="owner" hidden></span>
                    </div>
                    <h1 class="repo-name">RepoGif</h1>
                </div>
                <div class="star-pill" id="star-pill">
                    <svg class="pill-icon" id="pill-icon" viewBox="0 0 16 16" aria-hidden="true">
                        <path d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.751.751 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"></path>
                    </svg>
                    <span class="pill-label">Star</span>
                </div>
            </div>

            <p class="description" id="description" hidden></p>

            <div class="badges" id="badges" hidden>
                <span class="badge language-badge" id="language-badge" hidden>
                    <span class="lang-dot" id="lang-dot"></span>
                    <span class="language-name" id="language-name"></span>
                </span>
                <span class="topics" id="topics"></span>
            </div>

            <div class="stats" id="stats">
                <div class="stat star-section" id="star-section">
                    <svg class="stat-icon star-icon" id="star-icon" viewBox="0 0 16 16" aria-hidden="true">
                        <path d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.751.751 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"></path>
                    </svg>
                    <div class="stat-copy">
                        <span class="star-count-slot">
                            <span class="star-count-sizer" id="star-count-sizer">0</span>
                            <span class="star-count" id="star-count">0</span>
                        </span>
                        <span class="stat-label">Stars</span>
                    </div>
                </div>
                <div class="stat fork-section" id="fork-section">
                    <svg class="stat-icon fork-icon" viewBox="0 0 16 16" aria-hidden="true">
                        <path d="M5 5.372v.878c0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75v-.878a2.25 2.25 0 1 1 1.5 0v.878a2.25 2.25 0 0 1-2.25 2.25h-1.5v2.128a2.251 2.251 0 1 1-1.5 0V8.5h-1.5A2.25 2.25 0 0 1 3.5 6.25v-.878a2.25 2.25 0 1 1 1.5 0ZM5 3.25a.75.75 0 1 0-1.5 0 .75.75 0 0 0 1.5 0Zm6.75.75a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Zm-3 8.75a.75.75 0 1 0-1.5 0 .75.75 0 0 0 1.5 0Z"></path>
                    </svg>
                    <div class="stat-copy">
                        <span class="fork-count">0</span>
                        <span class="stat-label">Forks</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="hero" id="hero" hidden>
            <img class="hero-image" id="hero-image" alt="">
        </div>
    </div>

    <script>
        const LANGUAGE_COLORS = {
            JavaScript: "#f1e05a",
            TypeScript: "#3178c6",
            Python: "#3572A5",
            Rust: "#dea584",
            Go: "#00ADD8",
            Ruby: "#701516",
            Java: "#b07219",
            "C++": "#f34b7d",
            C: "#555555",
            HTML: "#e34c26",
            CSS: "#563d7c",
            Shell: "#89e051",
            Swift: "#F05138",
            Kotlin: "#A97BFF"
        };

        function getUrlParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        function clamp01(value) {
            return Math.min(1, Math.max(0, value));
        }

        function easeInOutCubic(value) {
            return value < 0.5
                ? 4 * value * value * value
                : 1 - Math.pow(-2 * value + 2, 3) / 2;
        }

        function parseCount(value) {
            if (value === null || value === undefined || value === "") {
                return 0;
            }
            const text = String(value).trim().toLowerCase().replace(/,/g, "");
            if (text.endsWith("k")) {
                return Math.round(parseFloat(text) * 1000);
            }
            if (text.endsWith("m")) {
                return Math.round(parseFloat(text) * 1000000);
            }
            const parsed = parseFloat(text);
            return Number.isFinite(parsed) ? Math.round(parsed) : 0;
        }

        function formatCount(value) {
            return Math.max(0, Math.round(value)).toLocaleString("en-US");
        }

        function hexToRgb(hex) {
            const full = hex.length === 4
                ? "#" + hex.slice(1).split("").map((ch) => ch + ch).join("")
                : hex;
            const number = parseInt(full.slice(1), 16);
            return [(number >> 16) & 255, (number >> 8) & 255, number & 255];
        }

        function mix(from, to, amount) {
            return from.map((channel, index) => Math.round(channel + (to[index] - channel) * amount));
        }

        function rgb(channels) {
            return `rgb(${channels[0]}, ${channels[1]}, ${channels[2]})`;
        }

        function rgba(channels, alpha) {
            return `rgba(${channels[0]}, ${channels[1]}, ${channels[2]}, ${alpha})`;
        }

        function luminance(channels) {
            const scaled = channels.map((channel) => {
                const value = channel / 255;
                return value <= 0.03928 ? value / 12.92 : Math.pow((value + 0.055) / 1.055, 2.4);
            });
            return 0.2126 * scaled[0] + 0.7152 * scaled[1] + 0.0722 * scaled[2];
        }

        function showHero(src, focus) {
            const hero = document.getElementById("hero");
            const image = document.getElementById("hero-image");
            if (!hero || !image || !src) {
                return;
            }
            if (focus) {
                document.documentElement.style.setProperty("--hero-focus", focus);
            }
            image.src = src;
            hero.hidden = false;
            document.getElementById("spotlight").classList.add("has-hero");
        }

        window.setHero = function(src) {
            showHero(src, getUrlParam("hero_focus"));
        };

        function render() {
            const width = parseFloat(getUrlParam("width") || 1200);
            const height = parseFloat(getUrlParam("height") || 675);
            document.documentElement.style.setProperty("--gif-width", `${width}px`);
            document.documentElement.style.setProperty("--gif-height", `${height}px`);

            const spotlight = document.getElementById("spotlight");
            spotlight.classList.toggle("is-square", height >= width * 0.92);

            const repoName = getUrlParam("repo_name");
            if (repoName) {
                document.querySelector(".repo-name").textContent = repoName;
            }

            const owner = getUrlParam("owner");
            const ownerEl = document.getElementById("owner");
            if (owner) {
                ownerEl.textContent = owner;
                ownerEl.hidden = false;
            }

            const description = getUrlParam("description");
            const descriptionEl = document.getElementById("description");
            if (description) {
                descriptionEl.textContent = description;
                descriptionEl.hidden = false;
            }

            const accent = /^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(getUrlParam("accent") || "")
                ? getUrlParam("accent")
                : "#f5c451";
            document.documentElement.style.setProperty("--accent", accent);
            const accentRgb = hexToRgb(accent);
            const neutral = [139, 147, 167];
            const paper = [247, 248, 251];
            const ink = luminance(accentRgb) > 0.62 ? [26, 20, 4] : [255, 255, 255];

            const language = getUrlParam("language");
            const topicValues = (getUrlParam("topics") || "")
                .split(",")
                .map((topic) => topic.trim())
                .filter(Boolean)
                .filter((topic) => !language || topic.toLowerCase() !== language.toLowerCase())
                .slice(0, 4);
            const badges = document.getElementById("badges");
            if (language || topicValues.length) {
                badges.hidden = false;
            }
            if (language) {
                const languageBadge = document.getElementById("language-badge");
                languageBadge.hidden = false;
                document.getElementById("language-name").textContent = language;
                document.getElementById("lang-dot").style.background = LANGUAGE_COLORS[language] || accent;
            }
            const topics = document.getElementById("topics");
            topics.replaceChildren();
            topicValues.forEach((topic) => {
                const badge = document.createElement("span");
                badge.className = "badge topic-badge";
                badge.textContent = topic;
                badge.style.borderColor = rgba(accentRgb, 0.45);
                topics.appendChild(badge);
            });

            const forks = getUrlParam("forks");
            if (forks !== null) {
                document.querySelector(".fork-count").textContent = formatCount(parseCount(forks));
            }
            const showForks = getUrlParam("show_forks");
            if (showForks === "false") {
                document.getElementById("fork-section").style.display = "none";
                document.getElementById("stats").classList.add("no-forks");
            }

            const heroParam = getUrlParam("hero");
            if (heroParam) {
                showHero(heroParam, getUrlParam("hero_focus"));
            } else if (getUrlParam("hero_focus")) {
                document.documentElement.style.setProperty("--hero-focus", getUrlParam("hero_focus"));
            }

            const progressParam = getUrlParam("progress");
            let linear = 0;
            if (progressParam !== null && progressParam !== "") {
                linear = clamp01(parseFloat(progressParam));
            } else if (getUrlParam("starred") === "true") {
                linear = 1;
            }
            const eased = easeInOutCubic(linear);
            const stars = parseCount(getUrlParam("stars"));
            const endCount = stars + 1;
            const shown = Math.round(endCount * eased);
            const starT = eased;
            const finalLabel = formatCount(endCount);
            document.getElementById("star-count-sizer").textContent = finalLabel;
            document.getElementById("star-count").textContent = formatCount(shown);

            const starFill = mix(neutral, accentRgb, starT);
            const countColor = mix(paper, accentRgb, starT);
            document.getElementById("star-icon").style.fill = rgb(starFill);
            document.getElementById("pill-icon").style.fill = starT > 0.62 ? rgb(ink) : rgb(mix(neutral, accentRgb, starT));
            document.getElementById("star-count").style.color = rgb(countColor);
            document.getElementById("star-pill").style.background = starT > 0.62
                ? rgb(accentRgb)
                : rgba(mix([255, 255, 255], accentRgb, starT * 0.35), 0.08);
            document.getElementById("star-pill").style.borderColor = rgba(accentRgb, 0.18 + starT * 0.82);
            document.getElementById("star-pill").style.color = starT > 0.62 ? rgb(ink) : "#f7f8fb";
            document.querySelector(".pill-label").textContent = starT > 0.62 ? "Starred" : "Star";

            const pop = (1 + 0.14 * Math.sin(starT * Math.PI)).toFixed(4);
            document.getElementById("star-icon").style.transform = `scale(${pop})`;
            document.getElementById("pill-icon").style.transform = `scale(${pop})`;

            const starSection = document.getElementById("star-section");
            starSection.style.background = rgba(accentRgb, 0.04 + 0.16 * starT);
            starSection.style.borderColor = rgba(accentRgb, 0.10 + 0.5 * starT);
            spotlight.style.borderColor = rgba(accentRgb, 0.14 + 0.55 * starT);
            const glow = Math.round(26 * starT);
            spotlight.style.boxShadow = `0 24px 60px rgba(0,0,0,0.45), 0 0 ${glow}px ${rgba(accentRgb, 0.38 * starT)}, inset 0 1px 0 rgba(255,255,255,0.18)`;
            spotlight.classList.toggle("starred", starT > 0.62);
            starSection.classList.toggle("starred", starT > 0.62);
        }

        document.addEventListener("DOMContentLoaded", render);
        window.render = render;
    </script>
</body>
</html>
