<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RepoGif Template 13 - Run it</title>
    <style>
        /*
         * Concept: show what the project does by running it. The usage snippet
         * types itself into an editor, the run prints its real output line, and
         * the result slides out of the bottom of the card like a print.
         * Motion verb: type, then print.
         */
        @font-face { font-family: "Plate"; src: url("fonts/archivo-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
        @font-face { font-family: "Plate"; src: url("fonts/archivo-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
        @font-face { font-family: "Plate"; src: url("fonts/archivo-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
        @font-face { font-family: "Code"; src: url("fonts/jetbrains-mono-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
        @font-face { font-family: "Code"; src: url("fonts/jetbrains-mono-latin-700-normal.woff2") format("woff2"); font-weight: 700; }

        :root {
            --plate: #e3b341;
            --ink: #111110;
            --ink-soft: rgba(17, 17, 16, 0.72);
            --editor: #111110;
            --code: #e8e3d6;
            --code-muted: #8a857a;
            --code-accent: #e3b341;
            --u: 1px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: var(--gif-width, 1200px);
            height: var(--gif-height, 675px);
            overflow: hidden;
            background: var(--plate);
            -webkit-font-smoothing: antialiased;
        }
        .plate { position: relative; width: 100%; height: 100%; color: var(--ink); font-family: "Plate", sans-serif; }

        .identity { position: absolute; }
        .owner { font-size: calc(22 * var(--u)); font-weight: 500; color: var(--ink-soft); }
        .repo {
            font-weight: 700;
            letter-spacing: -0.035em;
            line-height: 0.95;
            margin-top: calc(8 * var(--u));
            margin-left: -0.05em;
        }
        .description {
            margin-top: calc(18 * var(--u));
            font-size: calc(21 * var(--u));
            line-height: 1.4;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 3;
            overflow: hidden;
            text-wrap: pretty;
        }

        /* Editor: black housing, bleeds off the bottom */
        .editor {
            position: absolute;
            background: var(--editor);
            border-radius: calc(10 * var(--u)) calc(10 * var(--u)) 0 0;
            overflow: hidden;
            color: var(--code);
        }
        .tabbar {
            height: calc(46 * var(--u));
            display: flex;
            align-items: flex-end;
            padding: 0 calc(14 * var(--u));
            border-bottom: 1px solid #262622;
        }
        .tab {
            height: calc(34 * var(--u));
            display: flex;
            align-items: center;
            padding: 0 calc(14 * var(--u));
            font-family: "Plate", sans-serif;
            font-size: calc(15 * var(--u));
            font-weight: 500;
            color: var(--code);
            border-bottom: calc(2 * var(--u)) solid var(--code-accent);
        }
        pre {
            font-family: "Code", monospace;
            font-size: var(--code-size, 19px);
            line-height: 1.6;
            padding: calc(22 * var(--u)) calc(22 * var(--u)) 0 0;
            white-space: pre;
            counter-reset: line;
        }
        .ln { display: block; padding-left: calc(64 * var(--u)); position: relative; min-height: 1.6em; }
        .ln::before {
            counter-increment: line;
            content: counter(line);
            position: absolute;
            left: 0;
            width: calc(44 * var(--u));
            text-align: right;
            color: #4d4a43;
        }
        .k { font-weight: 700; color: #f3eee2; }
        .f { font-weight: 700; color: #f3eee2; }
        .s, .n { color: var(--code-accent); }
        .a, .p, .c { color: var(--code-muted); }
        .caret {
            display: inline-block;
            width: 0.58em;
            height: 1.15em;
            vertical-align: -0.2em;
            background: var(--code-accent);
        }
        .output {
            font-family: "Code", monospace;
            font-size: var(--code-size, 19px);
            line-height: 1.6;
            padding: calc(18 * var(--u)) 0 0 calc(64 * var(--u));
            color: var(--code-muted);
        }
        .output .ok { color: var(--code); }
        .output .ok b { color: var(--code-accent); font-weight: 700; }

        /* The print: result card with a hard shadow, comes up from below */
        .print {
            position: absolute;
            background: #f3eee2;
            padding: calc(10 * var(--u));
            border-radius: calc(6 * var(--u));
            box-shadow: calc(10 * var(--u)) calc(10 * var(--u)) 0 0 rgba(17, 17, 16, 0.9);
            will-change: transform;
        }
        .hero-image { display: block; width: 100%; height: auto; border-radius: calc(3 * var(--u)); }
        .print[hidden] { display: none; }
    </style>
</head>
<body>
    <main class="plate" id="plate">
        <header class="identity" id="identity">
            <div class="owner" id="owner" hidden></div>
            <h1 class="repo" id="repo">repogif</h1>
            <p class="description" id="description" hidden></p>
        </header>

        <section class="editor" id="editor">
            <div class="tabbar"><div class="tab" id="tab">example.py</div></div>
            <pre id="pre"></pre>
            <div class="output" id="output"></div>
        </section>

        <figure class="print" id="print" hidden>
            <img class="hero-image" id="hero-image" alt="">
        </figure>
    </main>

    <script>
        window.repogifReady = false;
        function getUrlParam(name) { return new URLSearchParams(window.location.search).get(name); }
        const clamp01 = (v) => Math.max(0, Math.min(1, v));
        const seg = (p, a, b) => clamp01((p - a) / (b - a));
        const easeOutBack = (t) => { const c1 = 1.2, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };

        function hexToRgb(hex) {
            const full = hex.length === 4 ? "#" + hex.slice(1).split("").map((c) => c + c).join("") : hex;
            const n = parseInt(full.slice(1), 16);
            return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
        }
        function luminance(c) {
            const s = c.map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
            return 0.2126 * s[0] + 0.7152 * s[1] + 0.0722 * s[2];
        }
        const esc = (t) => t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

        const DEFAULT_CODE = 'from repogif.generator import generate_repo_gif\n\ngenerate_repo_gif(\n    repo_name="RepoGif",\n    owner="jhd3197",\n    stars="1k",\n    template="template13",\n    out="counter.gif",\n)';
        const KEYWORDS = new Set(("from import as def return class if else elif for while in not and or is with try except finally " +
            "True False None await async lambda yield const let var function new export default require").split(" "));

        /* Tokenize into [class, text] pairs. Small and forgiving: enough for usage snippets
           in Python, JS and shell. */
        function tokenize(code) {
            const out = [];
            const re = /(#[^\n]*|\/\/[^\n]*)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*'|`[^`]*`)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_$][\w$]*)|(\s+)|(.)/g;
            let m;
            while ((m = re.exec(code))) {
                if (m[1]) out.push(["c", m[1]]);
                else if (m[2]) out.push(["s", m[2]]);
                else if (m[3]) out.push(["n", m[3]]);
                else if (m[4]) {
                    const word = m[4];
                    const rest = code.slice(re.lastIndex);
                    if (KEYWORDS.has(word)) out.push(["k", word]);
                    else if (/^\s*=(?!=)/.test(rest)) out.push(["a", word]);
                    else if (/^\(/.test(rest)) out.push(["f", word]);
                    else out.push(["", word]);
                } else if (m[5]) out.push(["", m[5]]);
                else out.push(["p", m[6]]);
            }
            return out;
        }

        /* HTML for the first `count` characters, split into numbered lines. */
        function typed(tokens, count, caret) {
            let left = count;
            let html = "";
            for (const [cls, text] of tokens) {
                if (left <= 0) break;
                const piece = text.slice(0, left);
                left -= piece.length;
                html += cls ? `<span class="${cls}">${esc(piece)}</span>` : esc(piece);
            }
            if (caret) html += '<span class="caret"></span>';
            // Wrap each line; spans never cross newlines except whitespace tokens, which are plain text.
            return html.split("\n").map((line) => `<span class="ln">${line}</span>`).join("");
        }

        function fitName(el, maxW, maxSize, minSize) {
            let size = maxSize;
            el.style.display = "inline-block";
            el.style.whiteSpace = "nowrap";
            el.style.fontSize = size + "px";
            while (el.getBoundingClientRect().width > maxW && size > minSize) { size -= 2; el.style.fontSize = size + "px"; }
            if (el.getBoundingClientRect().width > maxW) el.style.whiteSpace = "normal";
            el.style.display = "block";
        }

        function render() {
            const W = parseFloat(getUrlParam("width") || 1200);
            const H = parseFloat(getUrlParam("height") || 675);
            const root = document.documentElement;
            root.style.setProperty("--gif-width", W + "px");
            root.style.setProperty("--gif-height", H + "px");
            const square = H >= W * 0.92;
            const u = square ? W / 760 : Math.min(W / 1200, H / 675);
            root.style.setProperty("--u", u + "px");

            const accent = /^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(getUrlParam("accent") || "") ? getUrlParam("accent") : "#e3b341";
            root.style.setProperty("--plate", accent);
            const L = luminance(hexToRgb(accent));
            if ((L + 0.05) / 0.056 < 1.05 / (L + 0.05)) {
                root.style.setProperty("--ink", "#f3eee2");
                root.style.setProperty("--ink-soft", "rgba(243,238,226,0.74)");
            }
            // Accent in code must read on the black editor; fall back to warm cream-gold on dark plates.
            root.style.setProperty("--code-accent", L > 0.12 ? accent : "#e3b341");

            const repo = getUrlParam("repo_name") || "repogif";
            const owner = getUrlParam("owner");
            document.getElementById("repo").textContent = repo;
            if (owner) { const o = document.getElementById("owner"); o.textContent = owner + " /"; o.hidden = false; }
            const description = getUrlParam("description");
            if (description) { const d = document.getElementById("description"); d.textContent = description; d.hidden = false; }

            const code = (getUrlParam("code") || DEFAULT_CODE).replace(/\r\n/g, "\n").replace(/\s+$/, "");
            const lang = (getUrlParam("language") || "Python").toLowerCase();
            const ext = { python: "py", javascript: "js", typescript: "ts", shell: "sh", bash: "sh", rust: "rs", go: "go", ruby: "rb" }[lang] || "py";
            const outMatch = code.match(/\bout\s*=\s*["']([^"']+)["']/);
            document.getElementById("tab").textContent = "example." + ext;

            // Layout
            const id = document.getElementById("identity");
            const ed = document.getElementById("editor");
            const pr = document.getElementById("print");
            const repoEl = document.getElementById("repo");
            const pad = 56 * u;
            const lines = code.split("\n");
            const longest = Math.max(...lines.map((l) => l.length));
            let edBox, printBox;
            if (!square) {
                const edW = W * 0.56;
                edBox = { left: pad, top: pad, width: edW, height: H - pad + 12 * u };
                const colLeft = pad + edW + 40 * u;
                Object.assign(id.style, { left: colLeft + "px", top: pad + "px", width: (W - colLeft - pad) + "px" });
                fitName(repoEl, W - colLeft - pad, 68 * u, 34 * u);
                printBox = { left: pad + edW - 120 * u, width: W - (pad + edW - 120 * u) - pad * 0.7 };
            } else {
                Object.assign(id.style, { left: pad * 0.9 + "px", top: pad * 0.8 + "px", width: (W - pad * 1.8) + "px" });
                fitName(repoEl, W - pad * 1.8, 64 * u, 34 * u);
                document.getElementById("description").style.webkitLineClamp = 2;
                const top = id.getBoundingClientRect().bottom + 28 * u;
                edBox = { left: pad * 0.9, top, width: W - pad * 1.8, height: H - top + 12 * u };
                printBox = { left: W * 0.5, width: W * 0.5 - pad * 0.5 };
            }
            Object.assign(ed.style, { left: edBox.left + "px", top: edBox.top + "px", width: edBox.width + "px", height: edBox.height + "px" });
            // Code size: fit the longest line in the editor, within sane bounds.
            const codeSize = Math.max(11 * u, Math.min(22 * u, (edBox.width - 90 * u) / (Math.max(longest, 24) * 0.6)));
            root.style.setProperty("--code-size", codeSize + "px");

            // Progress
            let p = 0;
            const prog = getUrlParam("progress");
            if (prog !== null && prog !== "") p = clamp01(parseFloat(prog));

            const tokens = tokenize(code);
            const total = code.length;
            const typeT = seg(p, 0.04, 0.5);
            const shown = Math.round(total * typeT);
            const typing = typeT < 1;
            const blinkOn = typing || Math.floor(p * 18) % 2 === 0;
            document.getElementById("pre").innerHTML = typed(tokens, shown, p < 0.56 && blinkOn);

            const output = document.getElementById("output");
            const file = outMatch ? outMatch[1] : "output";
            let outHtml = "";
            if (p >= 0.54) outHtml += `<div>$ python example.${ext}</div>`;
            if (p >= 0.6) outHtml += `<div class="ok"><b>✓</b> Saved ${esc(file)}</div>`;
            output.innerHTML = outHtml;

            // The print
            const img = document.getElementById("hero-image");
            const hero = getUrlParam("hero");
            if (hero && !img.getAttribute("src")) img.src = hero;
            const hasImg = img.getAttribute("src") && img.complete && img.naturalWidth;
            if (img.getAttribute("src") && !hasImg) return;
            if (hasImg) {
                pr.hidden = false;
                const innerW = printBox.width - 20 * u;
                const cardH = innerW * img.naturalHeight / img.naturalWidth + 20 * u;
                const restTop = Math.max(pad * 0.6, H - cardH - pad * (square ? 0.7 : 0.9));
                Object.assign(pr.style, { left: printBox.left + "px", width: printBox.width + "px", top: restTop + "px" });
                const t = seg(p, 0.62, 0.76);
                const y = (1 - easeOutBack(t)) * (H - restTop + 30 * u);
                pr.style.transform = `translateY(${y.toFixed(2)}px)`;
            }
            window.repogifReady = true;
        }

        window.setHero = function (src) {
            const img = document.getElementById("hero-image");
            window.repogifReady = false;
            img.onload = render;
            img.src = src;
            if (img.complete && img.naturalWidth) render();
        };
        document.addEventListener("DOMContentLoaded", render);
        window.render = render;
    </script>
</body>
</html>
